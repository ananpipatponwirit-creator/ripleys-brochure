<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripley's World Pattaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-5">
    <h1 class="text-3xl font-bold text-center mb-10">Attractions</h1>
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js'
        // เปลี่ยนค่าด้านล่างนี้เป็นค่าจริงจากหน้า API ของคุณ
        const supabase = createClient('sb_publishable_6OYvR2_tAQfTdqUnu115yw_6AxHu68-')
        
        async function load() {
            const { data } = await supabase.from('attractions').select('*')
            document.getElementById('grid').innerHTML = data.map(item => `
                <div class="bg-gray-800 p-4 rounded-xl shadow-lg">
                    <img src="${item.cover || 'https://via.placeholder.com/400'}" class="w-full h-48 object-cover rounded-lg">
                    <h2 class="text-xl font-bold mt-3">${item.name.th}</h2>
                    <p class="text-gray-400 text-sm mt-1">${item.description.th.substring(0, 100)}...</p>
                </div>
            `).join('')
        }
        load()
    </script>
</body>
</html>
